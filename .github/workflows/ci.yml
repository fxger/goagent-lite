name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # 压测（tests/benchmark）是性能验证工具，结果依赖机器规格，
      # 不作为 CI 门禁；本地或专用机器上按 docs/benchmark.md 执行。
      - name: test
        run: go test -race -count=1 ./internal/... ./tests/integration/...
